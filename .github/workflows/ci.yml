name: CI

on:
  push:
    branches: [master]   # feature 分支由 PR 触发, 避免 push+PR 重复跑两遍 CI
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: 单测 + E2E + 构建门禁
    runs-on: ubuntu-latest
    timeout-minutes: 30   # Chromium 下载偶尔慢, 15m 曾误杀正常 run
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖 (npm ci, 严格按 package-lock.json 复现)
        run: npm ci

      - name: 生成 Prisma client
        run: npx prisma generate

      - name: 单元测试 (vitest)
        run: npm test

      - name: SM-2 算法脚本测试
        run: npm run test:sm2

      - name: 生产构建 (清 dist + vite build)
        run: npm run build

      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: 安装 Playwright Chromium (国内镜像加速)
        run: npx playwright install chromium --with-deps
        env:
          PLAYWRIGHT_DOWNLOAD_HOST: https://cdn.npmmirror.com/binaries/playwright

      - name: E2E 测试 (Playwright, 桌面+手机视口, API 全 mock)
        run: npx playwright test

      - name: 上传构建产物 (便于验收/回查)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
