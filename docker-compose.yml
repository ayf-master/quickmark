services:
  db:
    image: mysql:8.0
    container_name: quickmark-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?请在 .env 设置 DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-quickmark}
      MYSQL_CHARACTER_SET_SERVER: utf8mb4
      MYSQL_COLLATION_SERVER: utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: quickmark-redis
    restart: always
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: quickmark-app
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3000
      USE_PRISMA: "1"
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 设置 DB_PASSWORD}
      DB_NAME: ${DB_NAME:-quickmark}
      DATABASE_URL: mysql://root:${DB_PASSWORD:?请在 .env 设置 DB_PASSWORD}@db:3306/${DB_NAME:-quickmark}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: quickmark
      JWT_AUDIENCE: quickmark-web
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: info
      ALLOW_REGISTER: "1"
      SMTP_HOST: smtp.qq.com
      SMTP_PORT: "465"
      SMTP_SECURE: "true"
      SMTP_USER: 3351247805@qq.com
      SMTP_PASS: ${SMTP_PASS:?请在 .env 设置 SMTP_PASS}
      MAIL_FROM: "QuickMark <3351247805@qq.com>"
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads
      # 开发期挂载后端代码, 改 prisma/*.js / server.js 即时生效 (无需重建镜像)
      - ./prisma:/app/prisma
      - ./server.js:/app/server.js
      - ./docker-entrypoint.sh:/app/docker-entrypoint.sh

volumes:
  mysql_data:
  uploads:
