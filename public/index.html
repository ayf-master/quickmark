<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#5B8DEF">
  <title>QuickMark - 快记</title>
  <script>
    (function () {
      try {
        var saved = localStorage.getItem('quickmark-theme');
        var theme = saved;
        if (!theme) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.setAttribute('data-theme', theme);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div id="app-root"></div>
  <script src="/vendor/vue.global.js"></script>
  <script src="/vendor/tailwindcss.js"></script>
  <script src="/vendor/markdown-it.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/store.js"></script>
  <script src="/js/comps/theme-toggle.js"></script>
  <script src="/js/comps/toast.js"></script>
  <script src="/js/comps/shortcut-help.js"></script>
  <script src="/js/comps/category-dialog.js"></script>
  <script src="/js/comps/note-card.js"></script>
  <script src="/js/comps/note-list.js"></script>
  <script src="/js/comps/note-editor.js"></script>
  <script src="/js/comps/app-header.js"></script>
  <script src="/js/comps/sidebar.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
